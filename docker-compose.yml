services:
  postgres:
    image: postgres:16-alpine
    container_name: botchbuild-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botchbuild}
      POSTGRES_USER: ${POSTGRES_USER:-botchbuild}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botchbuild}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botchbuild} -d ${POSTGRES_DB:-botchbuild}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botchbuild-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      BACKEND_PUBLIC_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-botchbuild}:${POSTGRES_PASSWORD:-botchbuild}@postgres:5432/${POSTGRES_DB:-botchbuild}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-characters}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_2FA_SECRET: ${JWT_2FA_SECRET:-change-me-2fa-secret-at-least-32-characters}
      JWT_2FA_EXPIRES_IN: 5m
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-dev-webhook-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-paystack_dev_secret}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@botchbuild.local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      RATE_LIMIT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_GLOBAL_WINDOW_MS:-900000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-500}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-40}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-200}
      RATE_LIMIT_WEBHOOK_MAX: ${RATE_LIMIT_WEBHOOK_MAX:-600}
      RATE_LIMIT_OPS_MAX: ${RATE_LIMIT_OPS_MAX:-60}
      OPS_DEAD_JOB_THRESHOLD: ${OPS_DEAD_JOB_THRESHOLD:-100}
      OPS_WORKER_POLL_MS: ${OPS_WORKER_POLL_MS:-5000}
      OPS_WORKER_BATCH_SIZE: ${OPS_WORKER_BATCH_SIZE:-30}
    ports:
      - "4000:4000"
    command: sh -c "npm run migrate && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botchbuild-backend-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      BACKEND_PUBLIC_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-botchbuild}:${POSTGRES_PASSWORD:-botchbuild}@postgres:5432/${POSTGRES_DB:-botchbuild}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-characters}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_2FA_SECRET: ${JWT_2FA_SECRET:-change-me-2fa-secret-at-least-32-characters}
      JWT_2FA_EXPIRES_IN: 5m
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-dev-webhook-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-paystack_dev_secret}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@botchbuild.local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      RATE_LIMIT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_GLOBAL_WINDOW_MS:-900000}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-500}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-40}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-200}
      RATE_LIMIT_WEBHOOK_MAX: ${RATE_LIMIT_WEBHOOK_MAX:-600}
      RATE_LIMIT_OPS_MAX: ${RATE_LIMIT_OPS_MAX:-60}
      OPS_DEAD_JOB_THRESHOLD: ${OPS_DEAD_JOB_THRESHOLD:-100}
      OPS_WORKER_POLL_MS: ${OPS_WORKER_POLL_MS:-5000}
      OPS_WORKER_BATCH_SIZE: ${OPS_WORKER_BATCH_SIZE:-30}
    command: sh -c "npm run migrate && npm run worker"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: botchbuild-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    command: sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
